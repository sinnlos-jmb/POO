<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Gemini (Minimalista)</title>
    <link rel="stylesheet" href="gem.css" />
</head>
<body>
    <div class="container">
        <h1 class="header">
            Chat con Gemini
        </h1>

        <div class="controls-area">
            <div class="control-group">
                <label for="llm">Modelo:</label>
                <select id="llm">
                    <option value="gemma-3n-e4b-i">gemma-3n-e4b-it</option>
                    <option value="gemma-3-27b">gemma-3-27b</option>
                    <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                    <option value="gemini-2.5-flash-lite-preview-06-17">gemini-2.5-flash-LITE</option>
                    <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                    <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                    <!-- Puedes añadir más modelos aquí si los configuras en el backend -->
                </select>
            </div>
            <div class="control-group">
                <label for="temperatureSlider">Temperatura:</label>
                <input
                    type="range"
                    id="temperatureSlider"
                    min="0.0"
                    max="1.0"
                    step="0.1"
                    value="0.7"
                />
                <span id="temperatureValue" class="temperature-value">0.7</span>
            </div>
        </div>

        <div id="chatBox" class="chat-box">
            <!-- Mensajes del chat se insertarán aquí -->
        </div>

        <div id="errorMessage" class="error-message" role="alert">
            <!-- Mensajes de error se insertarán aquí -->
        </div>

        <div class="input-area">
            <input
                type="text"
                id="promptInput"
                class="prompt-input"
                placeholder="Escribe tu mensaje aquí..."
            />
            <button
                id="sendButton"
                class="send-button"
            >
                Enviar
            </button>
        </div>
        <div id="loadingIndicator" class="loading-indicator">
            Generando respuesta...
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const sendButton = document.getElementById('sendButton');
        const chatBox = document.getElementById('chatBox');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');
        const llm = document.getElementById('llm'); // Nuevo: Selector de modelo
        const temperatureSlider = document.getElementById('temperatureSlider'); // Nuevo: Slider de temperatura
        const temperatureValueSpan = document.getElementById('temperatureValue'); // Nuevo: Indicador de valor de temperatura

        const SERVER_URL = 'http://localhost:3060';

        // Inicializar el valor de la temperatura en el span
        temperatureValueSpan.textContent = temperatureSlider.value;

        // Escuchar cambios en el slider de temperatura y actualizar el span
        temperatureSlider.addEventListener('input', () => {
            temperatureValueSpan.textContent = temperatureSlider.value;
        });

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'gemini-message');
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showErrorMessage(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        async function sendPrompt() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                showErrorMessage('Por favor, escribe un mensaje.');
                return;
            }

            addMessage(prompt, 'user');
            promptInput.value = '';
            sendButton.disabled = true;
            loadingIndicator.style.display = 'block';

            // Obtener los valores seleccionados para el modelo y la temperatura
            const selectedModel = llm.value;
            const selectedTemperature = parseFloat(temperatureSlider.value);

            try {
                const response = await fetch(`${SERVER_URL}/ask-gemini`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        llm: selectedModel, // Envía el modelo seleccionado
                        temperature: selectedTemperature // Envía la temperatura seleccionada
                    }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Error en el servidor: ${response.status} - ${errorData.error || errorData.details || 'Error desconocido'}`);
                }

                const data = await response.json();
                const geminiResponseText = data.response;

                addMessage(geminiResponseText, 'gemini');

            } catch (error) {
                console.error('Error al comunicarse con el servidor:', error);
                showErrorMessage(`Error: ${error.message}`);
            } finally {
                sendButton.disabled = false;
                loadingIndicator.style.display = 'none';
            }
        }

        sendButton.addEventListener('click', sendPrompt);

        promptInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendPrompt();
            }
        });
    </script>
</body>
</html>
