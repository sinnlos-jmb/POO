<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gem6.css" />
    <title>Gemini LLM Chat</title>
</head>
<body>
    <div class="container">
        <h1>Gemini LLM Chat</h1>

        <div class="settings-section">
            <div class="input-group">
                <label for="temperature">Temperature:</label>
                <input type="number" id="temperature" value="0.7" min="0" max="1" step="0.1">
            </div>
            <div class="input-group">
                <label for="model">Model:</label>
                <select id="model">
                    <option value="gemma-3n-e4b-it">gemma-3n-e4b-it</option>
                    <option value="gemma-3-27b-it">gemma-3-27b-it</option>
                    <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                    <option value="gemini-2.5-flash-lite-preview-06-17">gemini-2.5-flash-LITE</option>
                    <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                    <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                </select>
            </div>
        </div>

        <div class="chat-history" id="chatHistory">
            </div>

        <div class="message-input-section">
            <input type="text" id="userInput" placeholder="Type your message...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="gem6_chat.js"></script>
</body>
</html>
